<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EO</title>
<style>
body{
  margin:0;
  background:#0b0f14;
  color:white;
  font-family:Arial,sans-serif;
}
header{
  padding:18px;
  background:#111820;
  font-size:24px;
  font-weight:bold;
}
#chat{
  padding:18px;
  height:65vh;
  overflow-y:auto;
}
.eo,.du{
  padding:12px;
  margin:10px 0;
  border-radius:12px;
}
.eo{background:#18222d;}
.du{background:#26384a;}
#unten{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  gap:8px;
  padding:12px;
  background:#111820;
}
input{
  flex:1;
  padding:14px;
  border-radius:10px;
  border:0;
  font-size:16px;
}
button{
  padding:14px;
  border:0;
  border-radius:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>EO 🤖</header>

<div id="chat">
  <div class="eo">
    <b>EO:</b> Bereit. Was soll ich für dich machen?
  </div>
</div>

<div id="unten">
  <input id="frage" placeholder="Schreibe EO einen Befehl...">
  <button onclick="senden()">Senden</button>
</div>

<script>
function senden(){
  const feld=document.getElementById("frage");
  const text=feld.value.trim();

  if(!text) return;

  const chat=document.getElementById("chat");

  chat.innerHTML +=
    '<div class="du"><b>Du:</b> '+text+'</div>';

  chat.innerHTML +=
    '<div class="eo"><b>EO:</b> Befehl erhalten.</div>';

  feld.value="";
  chat.scrollTop=chat.scrollHeight;
}
</script>

</body>
</html>
